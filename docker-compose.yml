volumes:
  pg_data:
  static:
  media:

services:
  
  backend:
    build: ./backend/
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    volumes:
      - static:/backend_static
      - media:/app/media
  db:
    image: postgres:13
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kittygram_user -d kittygram"]
      interval: 5s
      timeout: 5s
      retries: 5
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  frontend:
    build: ./frontend/
    env_file: .env
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static:/frontend_static

  gateway:
    build: ./nginx/
    env_file: .env
    volumes:
      - static:/staticfiles
      - media:/mediafiles
    ports:
      - 9000:80
